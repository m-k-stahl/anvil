<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box check</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2e333c;
    --text: #f2f4f7;
    --dim: #6f7783;
    --go: #4ec98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 96px; }

  header { padding: 8px 0 20px; }
  .boxname { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .boxmeta { color: var(--dim); font-size: 15px; margin: 4px 0 0; }

  .tally {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding: 10px 0 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .tally b { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
  .tally span { color: var(--dim); font-size: 16px; }
  .tally.done b { color: var(--go); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  li:active { background: var(--panel); }
  .mark {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 7px;
    border: 2px solid var(--dim);
    display: grid; place-items: center;
  }
  .mark::after {
    content: ""; width: 15px; height: 8px;
    border-left: 3px solid var(--bg); border-bottom: 3px solid var(--bg);
    transform: rotate(-45deg) scale(0.4); opacity: 0;
    transition: opacity .12s, transform .12s;
  }
  .label { font-size: 18px; }
  li.on .mark { background: var(--go); border-color: var(--go); }
  li.on .mark::after { opacity: 1; transform: rotate(-45deg) scale(1); }
  li.on .label { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--line); }
  li:focus-visible { outline: 2px solid var(--go); outline-offset: -2px; }

  .reset {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0));
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 13px 28px; font-size: 16px; font-family: inherit;
  }
  .reset:active { background: var(--line); }

  .pick a {
    display: block; padding: 18px 4px; font-size: 19px;
    color: var(--text); text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  @media (prefers-reduced-motion: reduce) { .mark::after { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
// ---------------------------------------------------------------
// ADD OR EDIT BOXES HERE. Nothing below this block needs changing.
// ---------------------------------------------------------------
const BOXES = {
  1: {
    name: "Box 1",
    sub: "Network and console",
    items: [
      "Forge server",
      "Forge power supply",
      "SimNet",
      "SimNet power supply",
      "Router",
      "Router power supply",
      "Ethernet cable 1 of 3",
      "Ethernet cable 2 of 3",
      "Ethernet cable 3 of 3",
      "HDMI cable 1 of 2",
      "HDMI cable 2 of 2",
      "USB to ethernet adapter",
      "USB power supply with cord",
      "Lightning cable",
      "Mini keyboard",
      "Wireless mouse",
      "iPad mini"
    ]
  }
  // 2: { name: "Box 2", sub: "", items: ["item", "item"] },
};
// ---------------------------------------------------------------

const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("b");
const box = BOXES[id];

if (!box) {
  app.innerHTML =
    '<header><h1 class="boxname">Which box?</h1>' +
    '<p class="boxmeta">No box number in the link. Pick one.</p></header>' +
    '<div class="pick">' +
    Object.keys(BOXES).map(k =>
      '<a href="?b=' + k + '">' + BOXES[k].name + '</a>'
    ).join("") +
    '</div>';
} else {
  app.innerHTML =
    '<header><h1 class="boxname">' + box.name + '</h1>' +
    (box.sub ? '<p class="boxmeta">' + box.sub + '</p>' : '') + '</header>' +
    '<div class="tally" id="tally"></div>' +
    '<ul id="list">' +
    box.items.map((t, i) =>
      '<li tabindex="0" data-i="' + i + '"><span class="mark"></span>' +
      '<span class="label">' + t + '</span></li>'
    ).join("") +
    '</ul>' +
    '<button class="reset" id="reset">Start over</button>';

  const list = document.getElementById("list");
  const tally = document.getElementById("tally");

  function draw() {
    const left = box.items.length - list.querySelectorAll("li.on").length;
    tally.className = "tally" + (left === 0 ? " done" : "");
    tally.innerHTML = left === 0
      ? "<b>Complete</b><span>" + box.items.length + " of " + box.items.length + "</span>"
      : "<b>" + left + "</b><span>still to find</span>";
  }

  function toggle(li) { li.classList.toggle("on"); draw(); }

  list.addEventListener("click", e => {
    const li = e.target.closest("li");
    if (li) toggle(li);
  });
  list.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(e.target); }
  });
  document.getElementById("reset").addEventListener("click", () => {
    list.querySelectorAll("li.on").forEach(li => li.classList.remove("on"));
    draw();
  });

  draw();
}
</script>
</body>
</html>
