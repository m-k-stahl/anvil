<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box check</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2e333c;
    --text: #f2f4f7;
    --dim: #6f7783;
    --go: #4ec98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 96px; }
  a { color: inherit; }

  .back a {
    display: inline-block; padding: 10px 14px 10px 0; margin-top: -6px;
    color: var(--go); text-decoration: none; font-size: 17px;
  }
  header { padding: 4px 0 20px; }
  .boxname { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .boxmeta { color: var(--dim); font-size: 15px; margin: 4px 0 0; }
  .boxmeta a { color: var(--dim); }

  .tally {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding: 10px 0 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .tally b { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
  .tally span { color: var(--dim); font-size: 16px; }
  .tally.done b { color: var(--go); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  li.d1 { padding-left: 44px; min-height: 54px; }
  li.d2 { padding-left: 74px; min-height: 54px; }
  li.d1 .label, li.d2 .label { font-size: 17px; }
  li:active { background: var(--panel); }
  .mark {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 7px;
    border: 2px solid var(--dim);
    display: grid; place-items: center;
  }
  .mark::after {
    content: ""; width: 15px; height: 8px;
    border-left: 3px solid var(--bg); border-bottom: 3px solid var(--bg);
    transform: rotate(-45deg) scale(0.4); opacity: 0;
    transition: opacity .12s, transform .12s;
  }
  .label { font-size: 18px; flex: 1 1 auto; }
  li.on .mark { background: var(--go); border-color: var(--go); }
  li.on .mark::after { opacity: 1; transform: rotate(-45deg) scale(1); }
  li.on .label { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--line); }
  li:focus-visible { outline: 2px solid var(--go); outline-offset: -2px; }

  /* A line that is another box or tote: filled in from that box's own checks. */
  li.ref .mark { border-radius: 50%; }
  li.ref .label { font-weight: 600; }
  li.ref.on .label { text-decoration: none; }
  .stat { flex: 0 0 auto; color: var(--dim); font-size: 15px; }
  .stat.left { color: var(--text); }
  .go { color: var(--dim); font-size: 22px; line-height: 1; }

  .reset {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0));
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 13px 28px; font-size: 16px; font-family: inherit;
    white-space: nowrap;
  }
  .reset:active { background: var(--line); }

  .pick h2 { color: var(--dim); font-size: 14px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .06em; margin: 26px 0 4px; }
  .pick a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 16px 4px; font-size: 19px;
    color: var(--text); text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .pick a .stat.done { color: var(--go); }
  @media (prefers-reduced-motion: reduce) { .mark::after { transition: none; } }
</style>
</head>
<body>

<script>

      "Dopamine, Shea tubing",
      "Insulin, Shea tubing",

    ]

// Old card keys that now open a different list. The address bar is rewritten
// to the new key, so a card written before the change still lands right.
const ALIASES = {
  grey: "t4",   // the Grey Tote now rides inside Tote 4
};
// ---------------------------------------------------------------

// Ticks are saved on this phone, per box, and expire 48 hours after the last
// tap on that box. "Clear every box" on a load-out list wipes them all at
// once, for packing up at the end of class.
const PREFIX = "anvil-kit-box-";
const EXPIRE_MS = 48 * 60 * 60 * 1000;
const GROUPS = ["Load-out", "Totes", "Boxes"];

const app = document.getElementById("app");
let id = new URLSearchParams(location.search).get("b");
if (ALIASES[id]) {
  id = ALIASES[id];
  try { history.replaceState(null, "", "?b=" + encodeURIComponent(id)); } catch (e) {}
}
const mem = {};   // used only if the browser refuses storage (private mode)

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Each item becomes {key, label, depth} or {ref, depth}. Ticks are stored by
// the item's text (numbered if the same text repeats), so reordering the list
// never moves a tick onto the wrong item.
function parse(boxId) {
  const seen = {};
  return BOXES[boxId].items.map(raw => {
    const depth = (raw.match(/^-+/) || [""])[0].length;
    const text = raw.replace(/^-+\s*/, "");
    if (text.startsWith("@")) return { ref: text.slice(1), depth: depth };
    seen[text] = (seen[text] || 0) + 1;
    return { key: text + "#" + seen[text], label: text, depth: depth };
  });
}

function readTicks(boxId) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PREFIX + boxId)); }
  catch (e) { saved = mem[boxId] || null; }
  if (!saved || Date.now() - saved.t > EXPIRE_MS) return [];
  return saved.on || [];
}

function writeTicks(boxId, on) {
  const val = { t: Date.now(), on: on };
  mem[boxId] = on.length ? val : null;
  try {
    if (on.length) localStorage.setItem(PREFIX + boxId, JSON.stringify(val));
    else localStorage.removeItem(PREFIX + boxId);
  } catch (e) {}
}

function clearAll() {
  Object.keys(BOXES).forEach(k => writeTicks(k, []));
}

// Counts every tickable thing inside a box, following boxes inside boxes.
function count(boxId, path) {
  path = path || [];
  const r = { total: 0, left: 0, touched: false };
  if (!BOXES[boxId] || path.includes(boxId)) return r;
  const on = readTicks(boxId);
  if (on.length) r.touched = true;
  parse(boxId).forEach(it => {
    if (it.ref) {
      const c = count(it.ref, path.concat(boxId));
      r.total += c.total; r.left += c.left; r.touched = r.touched || c.touched;
    } else {
      r.total++;
      if (!on.includes(it.key)) r.left++;
    }
  });
  return r;
}

function statusText(c) {
  if (c.total && c.left === 0) return "complete";
  if (!c.touched) return "not checked";
  return c.left + " left";
}

// The tote (not the load-out list) a box is packed in, if any.
function packedIn(boxId) {
  return Object.keys(BOXES).find(k =>
    BOXES[k].group !== "Load-out" && parse(k).some(it => it.ref === boxId));
}

function renderPicker() {
  app.innerHTML =
    '<header><h1 class="boxname">All boxes</h1>' +
    '<p class="boxmeta">Pick a load-out list, tote or box.</p></header>' +
    '<div class="pick">' +
    GROUPS.map(g =>
      '<h2>' + g + '</h2>' +
      Object.keys(BOXES).filter(k => (BOXES[k].group || "Boxes") === g).map(k => {
        const s = statusText(count(k));
        return '<a href="?b=' + encodeURIComponent(k) + '"><span>' + esc(BOXES[k].name) + '</span>' +
          '<span class="stat' + (s === "complete" ? " done" : "") + '">' + s + '</span></a>';
      }).join("")
    ).join("") +
    '</div>';
}

function renderBox() {
  const box = BOXES[id];
  const items = parse(id);
  const on = readTicks(id);
  const isLoadout = box.group === "Load-out";
  const parent = packedIn(id);
  const c = count(id);

  const meta = [];
  if (box.sub) meta.push(esc(box.sub));
  if (parent) meta.push('Packed in <a href="?b=' + encodeURIComponent(parent) + '">' + esc(BOXES[parent].name) + '</a>');

  app.innerHTML =
    '<nav class="back"><a href="' + esc(location.pathname) + '">‹ All boxes</a></nav>' +
    '<header><h1 class="boxname">' + esc(box.name) + '</h1>' +
    (meta.length ? '<p class="boxmeta">' + meta.join(" · ") + '</p>' : '') + '</header>' +
    '<div class="tally' + (c.left === 0 ? " done" : "") + '">' +
    (c.left === 0
      ? "<b>Complete</b><span>" + c.total + " of " + c.total + "</span>"
      : "<b>" + c.left + "</b><span>still to find</span>") +
    '</div>' +
    '<ul id="list">' +
    items.map((it, i) => {
      const d = it.depth ? " d" + Math.min(it.depth, 2) : "";
      if (it.ref) {
        const child = BOXES[it.ref];
        if (!child) return '<li class="ref' + d + '"><span class="mark"></span><span class="label">Unknown box: ' + esc(it.ref) + '</span></li>';
        const s = statusText(count(it.ref));
        return '<li tabindex="0" class="ref' + d + (s === "complete" ? " on" : "") + '" data-ref="' + esc(it.ref) + '">' +
          '<span class="mark"></span><span class="label">' + esc(child.name) + '</span>' +
          '<span class="stat' + (s.endsWith("left") ? " left" : "") + '">' + s + '</span><span class="go">›</span></li>';
      }
      return '<li tabindex="0" class="' + d.trim() + (on.includes(it.key) ? " on" : "") + '" data-i="' + i + '">' +
        '<span class="mark"></span><span class="label">' + esc(it.label) + '</span></li>';
    }).join("") +
    '</ul>' +
    (isLoadout
      ? '<button class="reset" id="reset">Clear every box</button>'
      : '<button class="reset" id="reset">Start over</button>');

  const list = document.getElementById("list");

  function act(li, fromKeyboard) {
    if (!li) return;
    if (li.dataset.ref) { location.href = "?b=" + encodeURIComponent(li.dataset.ref); return; }
    if (li.dataset.i === undefined) return;
    const i = li.dataset.i;
    const key = items[i].key;
    const now = readTicks(id);
    writeTicks(id, now.includes(key) ? now.filter(k => k !== key) : now.concat(key));
    render();
    if (fromKeyboard) {
      const again = document.querySelector('li[data-i="' + i + '"]');
      if (again) again.focus();
    }
  }

  list.addEventListener("click", e => act(e.target.closest("li"), false));
  list.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(e.target.closest("li"), true); }
  });
  document.getElementById("reset").addEventListener("click", () => {
    if (isLoadout) {
      if (!confirm("Clear the ticks on every box and tote? Do this before packing up at the end of class.")) return;
      clearAll();
    } else {
      writeTicks(id, []);
    }
    render();
  });
}

function render() {
  if (BOXES[id]) renderBox(); else renderPicker();
}

// Redraw when coming back to this page: from another box, from another tab,
// or after ticks change in another tab. Keeps tote and load-out lines current.
window.addEventListener("pageshow", render);
window.addEventListener("storage", render);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

render();
</script>
